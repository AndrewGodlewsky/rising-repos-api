name: Build and deploy

# Every pull request and every push to main tests and builds the Worker. A
# push to main also deploys it to risingrepos.com/api/*.
#
# The two jobs are kept apart, as the site's are (rising-repos-site#175):
#
# - build runs this repository's code and the tools it installs. It can only
#   read the repository, holds no secret, and hands the built Worker on as an
#   artifact.
# - deploy never checks out the repository. It downloads the artifact and runs
#   a wrangler whose version is pinned below, so all it runs is named in this
#   file. It alone holds the Cloudflare token, from the deploy environment.
#
# Every action is pinned to a full commit, the same commits the site's
# workflows use.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust
        # With no name given, rustup installs what rust-toolchain.toml pins:
        # Rust 1.96.1 and its wasm32-unknown-unknown target.
        run: rustup toolchain install

      - name: Run the tests
        run: cargo test --locked

      - name: Install worker-build
        # It compiles from source, from the versions its own lock file names.
        run: cargo install worker-build --version 0.9.0 --locked

      - name: Build the Worker
        # worker-build downloads wasm-bindgen, wasm-opt, and esbuild, and
        # writes the Worker into build/.
        run: worker-build --release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker
          path: build
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: deploy
    permissions: {}
    concurrency:
      # Deploys take turns, and none is cancelled part way.
      group: cloudflare-worker-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker
          path: build

      - name: Deploy to risingrepos.com/api/*
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        # npm resolves wrangler and every package it pulls in as the registry
        # stood on the --before date, as the site's deploy does. No package's
        # install script runs. Node is the runner image's own. The flags were
        # checked against `wrangler deploy --help` at 4.155.0, and the command
        # bundles the Worker with --dry-run.
        run: >-
          npm exec --yes --ignore-scripts --before=2026-10-29
          --package=wrangler@4.155.0 --
          wrangler deploy build/index.js
          --name rising-repos-api
          --compatibility-date 2026-10-30
          --route "risingrepos.com/api/*"
